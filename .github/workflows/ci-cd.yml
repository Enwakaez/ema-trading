name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Import existing resources
        run: |
          terraform -chdir=terraform import aws_lambda_function.ema_trading ema_trading_function || true
          terraform -chdir=terraform import aws_iam_role.lambda_exec ema_trading_lambda_exec || true
          terraform -chdir=terraform import aws_iam_role_policy.lambda_policy ema_trading_lambda_exec:ema_trading_policy || true
          terraform -chdir=terraform import aws_cloudwatch_event_rule.schedule ema_trading_schedule || true
          terraform -chdir=terraform import aws_cloudwatch_event_target.lambda_target ema_trading_schedule/ema_trading_lambda || true
          terraform -chdir=terraform import aws_lambda_permission.allow_cloudwatch ema_trading_function/AllowExecutionFromCloudWatch || true

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve -var="secret_arn=${{ secrets.SECRET_ARN }}"

  python:
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
